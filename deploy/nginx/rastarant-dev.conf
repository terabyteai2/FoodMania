# Dev backend for QuickBytes (installed by deploy/dev-backend.sh, never by
# redeploy.sh). Serves ONLY dev.quickbytes.buzz and proxies to the dev uvicorn
# on 127.0.0.1:8003. Production (rastarant.conf / quickbytes.conf) is untouched.
#
# Exact server_name beats the *.quickbytes.buzz regex block, so customer-menu
# subdomains and the root domain keep routing to production.

# HTTP -> HTTPS redirect for the dev host.
server {
    listen 80;
    server_name dev.quickbytes.buzz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Dev backend API.
server {
    listen 443 ssl;
    server_name dev.quickbytes.buzz;
    client_max_body_size 300M;

    ssl_certificate /etc/letsencrypt/live/quickbytes.buzz-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quickbytes.buzz-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location /uploads/ {
        alias /var/www/rastarant_dev/backend/uploads/;
        expires 1w;
    }

    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

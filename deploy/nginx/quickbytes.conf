# HTTPS configuration for QuickBytes.
# Routes the root domain to the landing page and wildcard subdomains to customer menus.

# HTTP -> HTTPS redirect for landing and menu hosts.
server {
    listen 80;
    server_name quickbytes.buzz www.quickbytes.buzz *.quickbytes.buzz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Root domain -> static landing SPA.
server {
    listen 443 ssl;
    server_name quickbytes.buzz www.quickbytes.buzz;
    client_max_body_size 300M;

    ssl_certificate /etc/letsencrypt/live/quickbytes.buzz-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quickbytes.buzz-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location = /admin {
        return 301 /admin/;
    }

    # Restaurant-admin backend API routes. Keep this narrower than /admin/
    # so the platform-admin SPA can be served at /admin/.
    location ~ ^/admin/(login|google|staff|create|me|access|subscription|phone|demo|public-url|app-update|outlet-profile|outlets|chatbot|blocking-notice)(/.*)?$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Backend API routes.
    location ~ ^/(health|tenants|chatbot|devices|menu|inventory|dashboard|orders|payments|platform|ws|customer|webhooks|outlets|app-download|software-downloads|openapi\.json|docs|redoc)(/.*)?$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Platform Admin SPA.
    location /admin/ {
        alias /var/www/rastarant/platform_admin/;
        try_files $uri $uri/ @quickbytes_admin_spa;
    }
    location @quickbytes_admin_spa {
        root /var/www/rastarant/platform_admin;
        rewrite ^ /index.html break;
    }

    # Old POS bookmarks — pos_web now lives at the root domain.
    location /pos/ { return 301 /; }

    # Marketing / landing site.
    location = /landing { return 301 /landing/; }
    location /landing/ {
        alias /var/www/rastarant/landing/dist/templates/landing-page/;
        try_files $uri $uri/ @quickbytes_landing_spa;
    }
    location @quickbytes_landing_spa {
        root /var/www/rastarant/landing/dist/templates/landing-page;
        rewrite ^ /index.html break;
    }

    location = /get { return 301 /landing/; }

    location /uploads/ {
        alias /var/www/rastarant/backend/uploads/;
        expires 1w;
    }

    # Design-system assets loaded by ds-base.js via ../../ (resolves to site root)
    location ~ ^/(styles\.css$|tokens/|_ds_bundle\.js$|_ds_manifest\.json$) {
        root /var/www/rastarant/landing/dist;
    }

    # POS web app (pos_web/ → backend/pos_dist/) — the main product at the root domain.
    location / {
        root /var/www/rastarant/backend/pos_dist;
        try_files $uri $uri/ /index.html;
    }
}

# Wildcard subdomains -> customer menu SPA.
server {
    listen 443 ssl;
    server_name ~^(?<subdomain>.+)\.quickbytes\.buzz$;
    client_max_body_size 300M;

    ssl_certificate /etc/letsencrypt/live/quickbytes.buzz-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quickbytes.buzz-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location ~ ^/(health|tenants|chatbot|devices|menu|inventory|dashboard|orders|payments|platform|ws|customer|webhooks|outlets|admin|app-download|openapi\.json|docs|redoc)(/.*)?$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /uploads/ {
        alias /var/www/rastarant/backend/uploads/;
        expires 1w;
    }

    location / {
        root /var/www/rastarant/backend/frontend_dist;
        try_files $uri $uri/ /index.html;
    }
}

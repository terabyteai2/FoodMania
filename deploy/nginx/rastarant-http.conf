# HTTP vhost for Rastarant (port 80, bare IP or default_server).
# API routes under /admin/* must be proxied before the platform-admin SPA alias.

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 50M;

    location = /admin {
        return 301 /admin/;
    }

    location ~ ^/admin/(login|google|staff|create|me|access|subscription|phone|demo|public-url|app-update|outlet-profile|outlets|chatbot|blocking-notice)(/.*)?$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location /admin/ {
        alias /var/www/rastarant/platform_admin/;
        try_files $uri $uri/ @admin_spa;
    }
    location @admin_spa {
        root /var/www/rastarant/platform_admin;
        rewrite ^ /index.html break;
    }

    location /pos/ {
        alias /var/www/rastarant/pos_admin/;
        try_files $uri $uri/ @pos_spa;
    }
    location @pos_spa {
        root /var/www/rastarant/pos_admin;
        rewrite ^ /index.html break;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

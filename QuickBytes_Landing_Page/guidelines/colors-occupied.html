<!-- @dsCard group="Colors" viewport="700x150" name="Occupied table slate" subtitle="Occupied reads as neutral state — deliberately never lime" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); display: flex; gap: 10px; padding: 14px; background: var(--qb-bg); align-items: center; }
  .tile { width: 96px; height: 96px; border-radius: var(--radius-lg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-weight: 600; font-size: 16px; }
  .vacant { background: var(--qb-surface); border: 1px solid var(--qb-hairline); color: var(--qb-ink); }
  .occ { background: var(--qb-slate-bg); border: 1px solid var(--qb-slate-border); color: var(--qb-slate-ink); }
  .sub { font-size: 10px; font-weight: 500; opacity: 0.75; }
  .note { margin-left: 12px; font-size: 12px; color: var(--qb-muted); max-width: 280px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="tile vacant">T1<span class="sub">Vacant</span></div>
  <div class="tile occ">T2<span class="sub">Occupied · 2</span></div>
  <div class="tile occ">T3<span class="sub">Occupied · 4</span></div>
  <div class="tile vacant">T4<span class="sub">Vacant</span></div>
  <p class="note">Slate #EDF1F7 / #D5DEEC / ink #4C679C. Lime would imply an action to take; occupied is just a fact.</p>
</body>
</html>

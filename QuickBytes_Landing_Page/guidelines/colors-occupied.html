<!-- @dsCard group="Colors" viewport="800x160" name="State pastels" subtitle="Order/table states — Petpooja‑style tint + dark‑ink label" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); display: flex; gap: 8px; padding: 14px; background: var(--qb-surface); }
  .sw { flex: 1; border-radius: var(--radius-lg); border: 1px solid var(--qb-line); padding: 10px 12px; display: flex; flex-direction: column; justify-content: flex-end; height: 96px; }
  .name { font-size: 11px; font-weight: 600; }
  .hex { font-size: 10px; opacity: 0.7; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="sw" style="background: var(--qb-state-running); color: var(--qb-state-running-ink);"><span class="name">Running / Seated</span><span class="hex">#DCEBFB</span></div>
  <div class="sw" style="background: var(--qb-state-printed); color: var(--qb-state-printed-ink);"><span class="name">Bill printed</span><span class="hex">#E3F6EC</span></div>
  <div class="sw" style="background: var(--qb-state-kot); color: var(--qb-state-kot-ink);"><span class="name">Running KOT</span><span class="hex">#FCF3CF</span></div>
  <div class="sw" style="background: var(--qb-state-available); color: var(--qb-ink);"><span class="name">Vacant / Available</span><span class="hex">#FFFFFF · line</span></div>
</body>
</html>

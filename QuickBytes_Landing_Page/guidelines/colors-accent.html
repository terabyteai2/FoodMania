<!-- @dsCard group="Colors" viewport="760x160" name="Primary" subtitle="Royal-indigo blue #2F4FE0 — one primary action per screen" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); display: flex; gap: 8px; padding: 14px; background: var(--qb-surface); }
  .sw { flex: 1; border-radius: var(--radius-lg); border: 1px solid var(--qb-line); padding: 10px 12px; display: flex; flex-direction: column; justify-content: flex-end; height: 96px; }
  .name { font-size: 11px; font-weight: 600; }
  .hex { font-size: 10px; opacity: 0.7; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="sw" style="background: var(--qb-primary); color: var(--qb-primary-ink);"><span class="name">Primary</span><span class="hex">#2F4FE0</span></div>
  <div class="sw" style="background: var(--qb-primary-press); color: #fff;"><span class="name">Press</span><span class="hex">#2440C2</span></div>
  <div class="sw" style="background: var(--qb-primary-tint); color: var(--qb-ink);"><span class="name">Tint / Wash</span><span class="hex">#EEF1FE</span></div>
  <div class="sw" style="background: var(--qb-surface); color: var(--qb-primary-strong);"><span class="name">Strong · text on white</span><span class="hex">#1D339B</span></div>
  <div class="sw" style="background: var(--qb-navy); color: var(--qb-navy-ink);"><span class="name">Navy · secondary</span><span class="hex">#1E2A44</span></div>
</body>
</html>

<!-- @dsCard group="Colors" viewport="700x150" name="Accent" subtitle="Electric lime — one moment per screen; never white text on lime" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); display: flex; gap: 10px; padding: 14px; background: var(--qb-surface); }
  .sw { flex: 1; border-radius: var(--radius-lg); border: 1px solid var(--qb-hairline); padding: 12px 14px; display: flex; flex-direction: column; justify-content: flex-end; height: 96px; }
  .name { font-size: 12px; font-weight: 600; }
  .hex { font-size: 11px; opacity: 0.7; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="sw" style="background: var(--qb-lime); color: var(--qb-ink-on-lime);"><span class="name">Lime</span><span class="hex">#99FF47 · ink #14180E on top</span></div>
  <div class="sw" style="background: var(--qb-accent-wash); color: var(--qb-ink);"><span class="name">Accent wash</span><span class="hex">#F0FADF</span></div>
  <div class="sw" style="background: var(--qb-surface); color: var(--qb-accent-strong);"><span class="name">Accent strong</span><span class="hex">#3E7E14 — lime text on white</span></div>
</body>
</html>

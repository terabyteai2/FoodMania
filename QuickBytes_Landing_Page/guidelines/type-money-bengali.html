<!-- @dsCard group="Type" viewport="860x180" name="Money, numerals & Bengali" subtitle="৳ with tabular numerals; Noto Sans Bengali for বাংলা" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); color: var(--qb-ink); background: var(--qb-surface); padding: 18px 22px; display: flex; gap: 28px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .cap { font-size: 11px; color: var(--qb-muted); text-transform: uppercase; letter-spacing: var(--tracking-wide); font-weight: 600; margin-bottom: 2px; }
  .money { font-variant-numeric: tabular-nums; font-size: 15px; display: flex; justify-content: space-between; width: 200px; }
  .money b { font-weight: 600; }
  .bn { font-family: var(--font-bengali); font-size: 15px; }
</style>
</head>
<body>
  <div class="col">
    <span class="cap">Money — tabular, ৳ integer</span>
    <span class="money"><span>Subtotal</span><b>৳1,240</b></span>
    <span class="money"><span>VAT 5%</span><b>৳62</b></span>
    <span class="money"><span>Delivery · Dhanmondi</span><b>৳60</b></span>
    <span class="money" style="border-top: 1px solid var(--qb-line); padding-top: 6px;"><span>Total</span><b>৳1,362</b></span>
  </div>
  <div class="col">
    <span class="cap">Bengali — Noto Sans Bengali</span>
    <span class="bn">টেবিল · অর্ডার · স্টক</span>
    <span class="bn">অর্ডার গ্রহণ করলে সাথে সাথে KOT প্রিন্ট হয়।</span>
    <span class="bn" style="color: var(--qb-muted); font-size: 13px;">৬টি চ্যানেল, একটাই কিউ</span>
  </div>
</body>
</html>

<!-- @dsCard group="Spacing" viewport="860x170" name="Radii & elevation" subtitle="Soft rounded corners 8–20px; card shadow + hairline; blue glow moments" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); color: var(--qb-ink); background: var(--qb-bg); padding: 16px 20px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .demo { background: var(--qb-surface); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--qb-muted); flex-direction: column; gap: 2px; text-align: center; }
  .demo b { color: var(--qb-ink); font-size: 12px; }
  .trow { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--qb-muted); }
</style>
</head>
<body>
  <div class="demo" style="width: 140px; height: 100px; border-radius: var(--radius-xl); box-shadow: var(--shadow-card); border: 1px solid var(--qb-line);"><b>Card</b>16px · card shadow + line</div>
  <div class="demo" style="width: 130px; height: 48px; border-radius: var(--radius-md); background: var(--qb-primary); color: #fff; flex-direction: row; gap: 4px;"><b>Button</b>12px</div>
  <div class="demo" style="width: 90px; height: 32px; border-radius: var(--radius-pill); background: var(--qb-primary-tint); color: var(--qb-primary-strong);"><b>Chip / pill</b>full round</div>
  <div class="demo" style="width: 160px; height: 100px; border-radius: var(--radius-lg); box-shadow: var(--shadow-e3); border: none;"><b>Popover / e3</b>elevated</div>
  <div class="demo" style="width: 100px; height: 100px; border-radius: 50%; box-shadow: var(--shadow-glow); border: 1px solid var(--qb-line);"><b>Glow</b>blue halo</div>
</body>
</html>

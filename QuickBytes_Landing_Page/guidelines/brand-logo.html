<!-- @dsCard group="Brand" viewport="860x160" name="Logo" subtitle="Blue lightning-bolt mark — rounded square, white bolt on blue" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); display: flex; gap: 28px; padding: 20px 24px; background: var(--qb-surface); align-items: center; }
  .cell { display: flex; align-items: center; gap: 12px; }
  .cell img { display: block; }
  .lockup { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: var(--qb-ink); }
  .on-dark { background: var(--qb-ink); border-radius: 12px; padding: 18px 24px; }
  .on-dark .lockup { color: #fff; }
  .note { font-size: 12px; color: var(--qb-muted); max-width: 200px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="cell"><img src="../assets/logo.png" width="44" height="47" alt="QuickBytes logo"><span class="lockup">QuickBytes</span></div>
  <div class="cell on-dark"><img src="../assets/logo.png" width="36" height="39" alt=""><span class="lockup">QuickBytes</span></div>
  <p class="note">Mark works on white and ink. Use the brand blue — never recolor.</p>
</body>
</html>

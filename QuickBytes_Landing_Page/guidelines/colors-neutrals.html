<!-- @dsCard group="Colors" viewport="800x160" name="Neutrals" subtitle="Page bg, surfaces, text, lines" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); display: flex; gap: 8px; padding: 14px; background: var(--qb-surface); }
  .sw { flex: 1; border-radius: var(--radius-lg); border: 1px solid var(--qb-line); padding: 10px 12px; display: flex; flex-direction: column; justify-content: flex-end; height: 96px; }
  .name { font-size: 11px; font-weight: 600; }
  .hex { font-size: 10px; opacity: 0.7; }
</style>
</head>
<body>
  <div class="sw" style="background: var(--qb-ink); color: #fff;"><span class="name">Ink</span><span class="hex">#1B2330</span></div>
  <div class="sw" style="background: var(--qb-ink-2); color: #fff;"><span class="name">Ink 2</span><span class="hex">#5A6475</span></div>
  <div class="sw" style="background: var(--qb-muted); color: #fff;"><span class="name">Muted</span><span class="hex">#8A93A3</span></div>
  <div class="sw" style="background: var(--qb-bg); color: var(--qb-ink);"><span class="name">Background</span><span class="hex">#F6F7F9</span></div>
  <div class="sw" style="background: var(--qb-surface); color: var(--qb-ink);"><span class="name">Surface</span><span class="hex">#FFFFFF</span></div>
  <div class="sw" style="background: var(--qb-line); color: var(--qb-ink);"><span class="name">Line</span><span class="hex">#ECEEF2</span></div>
</body>
</html>

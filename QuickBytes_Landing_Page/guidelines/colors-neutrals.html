<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="White surfaces, warm-green-tinted greys, hairline borders" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); display: flex; gap: 10px; padding: 14px; background: var(--qb-surface); }
  .sw { flex: 1; border-radius: var(--radius-lg); border: 1px solid var(--qb-hairline); padding: 12px 14px; display: flex; flex-direction: column; justify-content: flex-end; height: 96px; }
  .name { font-size: 12px; font-weight: 600; }
  .hex { font-size: 11px; opacity: 0.7; }
</style>
</head>
<body>
  <div class="sw" style="background: var(--qb-ink); color: #fff;"><span class="name">Ink</span><span class="hex">#1A1E14</span></div>
  <div class="sw" style="background: var(--qb-muted); color: #fff;"><span class="name">Muted</span><span class="hex">#878C79</span></div>
  <div class="sw" style="background: var(--qb-bg); color: var(--qb-ink);"><span class="name">Background</span><span class="hex">#F7F8F4</span></div>
  <div class="sw" style="background: var(--qb-surface); color: var(--qb-ink);"><span class="name">Surface</span><span class="hex">#FFFFFF</span></div>
  <div class="sw" style="background: var(--qb-hairline); color: var(--qb-ink);"><span class="name">Hairline</span><span class="hex">#EDEEE8</span></div>
</body>
</html>

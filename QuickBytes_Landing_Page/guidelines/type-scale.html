<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="Inter 400–800, tight-tracked titles, sentence case" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); color: var(--qb-ink); background: var(--qb-surface); padding: 18px 22px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .label { width: 130px; font-size: 11px; color: var(--qb-muted); font-variant-numeric: tabular-nums; flex: none; }
</style>
</head>
<body>
  <div class="row"><span class="label">Display · 40/600</span><span style="font-size: var(--fs-display); font-weight: 600; letter-spacing: var(--tracking-tight); line-height: 1.1;">Net sales ৳84,200</span></div>
  <div class="row"><span class="label">Title · 24/600</span><span style="font-size: var(--fs-title); font-weight: 600; letter-spacing: var(--tracking-tight);">Orders · Tables · Stock</span></div>
  <div class="row"><span class="label">Heading · 18/600</span><span style="font-size: var(--fs-heading); font-weight: 600;">Revenue by category</span></div>
  <div class="row"><span class="label">Body · 15/400</span><span style="font-size: var(--fs-body);">Accepting an order prints the KOT immediately.</span></div>
  <div class="row"><span class="label">Caption · 13/400</span><span style="font-size: var(--fs-caption); color: var(--qb-muted);">Waiting 2 min · Messenger · 3 items</span></div>
  <div class="row"><span class="label">Micro · 11/600</span><span style="font-size: var(--fs-micro); font-weight: 600; letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--qb-muted);">BYTES BOT · PENDING · TABLE QR</span></div>
</body>
</html>

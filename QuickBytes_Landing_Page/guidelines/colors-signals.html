<!-- @dsCard group="Colors" viewport="700x150" name="Signals" subtitle="Success, warning, danger, info" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); display: flex; gap: 10px; padding: 14px; background: var(--qb-surface); }
  .sw { flex: 1; border-radius: var(--radius-lg); padding: 12px 14px; color: #fff; display: flex; flex-direction: column; justify-content: flex-end; height: 96px; }
  .name { font-size: 12px; font-weight: 600; }
  .hex { font-size: 11px; opacity: 0.8; }
</style>
</head>
<body>
  <div class="sw" style="background: var(--qb-success);"><span class="name">Success</span><span class="hex">#498F18</span></div>
  <div class="sw" style="background: var(--qb-warning);"><span class="name">Warning</span><span class="hex">#B0760A</span></div>
  <div class="sw" style="background: var(--qb-danger);"><span class="name">Danger</span><span class="hex">#D43A3F</span></div>
  <div class="sw" style="background: var(--qb-info);"><span class="name">Info</span><span class="hex">#3E6FE0</span></div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Terafoods — App Design (print)</title>
<!-- print build of Terafoods App Design.html
     replaces DesignCanvas pan/zoom with a flat paginated layout:
     one A4 portrait page per artboard, with a section cover before each
     group, page-break-after on every artboard. -->

<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  /* ─── Base ─── */
  html, body { margin: 0; padding: 0; background: #F8F8FA; }
  body {
    font-family: Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "cv01" 1, "cv11" 1;
    color: #1C1A17;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  * { box-sizing: border-box; }

  /* ─── Print page setup ─── */
  @page { size: A4 portrait; margin: 0; }

  .print-root { display: flex; flex-direction: column; }

  /* ─── Section cover ─── */
  .section-cover {
    width: 210mm;
    height: 297mm;
    padding: 36mm 28mm;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    background: #FFFFFF;
    break-after: page;
    page-break-after: always;
    border-bottom: 1px dashed transparent; /* screen separator only */
  }
  .section-eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #888780;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .section-title {
    font-size: 44px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.05;
    margin: 0 0 18px;
    color: #1C1A17;
    text-wrap: pretty;
  }
  .section-subtitle {
    font-size: 15px;
    line-height: 1.55;
    color: #5b5950;
    margin: 0;
    max-width: 540px;
    text-wrap: pretty;
  }
  .section-rule {
    width: 56px; height: 3px;
    background: #F5C127;
    margin-bottom: 28px;
  }

  /* ─── Artboard page ─── */
  .page {
    width: 210mm;
    height: 297mm;
    padding: 16mm 14mm 18mm;
    display: flex;
    flex-direction: column;
    background: #FFFFFF;
    break-after: page;
    page-break-after: always;
    break-inside: avoid;
    page-break-inside: avoid;
  }
  .page:last-child { break-after: auto; page-break-after: auto; }

  .page-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 8px;
    margin-bottom: 10px;
    border-bottom: 1px solid #EEEAE3;
  }
  .page-eyebrow {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #888780;
    font-weight: 600;
  }
  .page-label {
    font-size: 13px;
    color: #1C1A17;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .page-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  /* Some artboards (system notes, token map) are wider than the phone.
     Wrap them in a scaler that fits the available page area. */
  .artboard-scaler {
    transform-origin: center center;
  }

  /* ─── Screen-only chrome ─── */
  @media screen {
    body { background: #e6e3dd; padding: 24px 0; }
    .section-cover, .page {
      box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 12px 32px rgba(0,0,0,.06);
      margin: 0 auto 18px;
    }
  }

  /* Hide things that exist only for canvas mode. */
  .dc-header, .dc-btns, .dc-menu, [data-omelette-chrome] { display: none !important; }
  .tweaks-panel, [data-tweaks-panel] { display: none !important; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Stub out DesignCanvas + DCSection + DCArtboard + DCPostIt with print
     versions BEFORE any module that references them is evaluated. We still
     load design-canvas.jsx for the dcExport helper that other modules
     reference, then override its globals immediately after. -->
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel">
  // Print-mode overrides — replace pan/zoom canvas with a flat paginated
  // doc. Children of <DCSection> become one A4 page per <DCArtboard>,
  // preceded by a single section cover page.

  // dcFlatten: unwrap React fragments so tf-app.jsx's <> grouping doesn't
  // hide DCArtboard children.
  function dcFlattenPrint(children) {
    const out = [];
    React.Children.forEach(children, (c) => {
      if (c && c.type === React.Fragment) out.push(...dcFlattenPrint(c.props.children));
      else out.push(c);
    });
    return out;
  }

  function DesignCanvas({ children }) {
    return <div className="print-root">{children}</div>;
  }

  function DCSection({ id, title, subtitle, children }) {
    const flat = dcFlattenPrint(children);
    const artboards = flat.filter((c) => c && c.type === DCArtboard);
    const others    = flat.filter((c) => !(c && (c.type === DCArtboard)));
    return (
      <>
        <div className="section-cover">
          <div className="section-rule" />
          <div className="section-eyebrow">Section</div>
          <h1 className="section-title">{title}</h1>
          {subtitle ? <p className="section-subtitle">{subtitle}</p> : null}
        </div>
        {artboards.map((ab, i) => (
          <PrintPage
            key={(ab.props.id ?? ab.props.label ?? i) + ''}
            artboard={ab}
            section={title}
          />
        ))}
        {others.length > 0 ? (
          <div className="page">
            <div className="page-head">
              <span className="page-eyebrow">{title}</span>
              <span className="page-label">Notes</span>
            </div>
            <div className="page-body">{others}</div>
          </div>
        ) : null}
      </>
    );
  }

  // Marker — replaced inline by DCSection's mapping. Returning null keeps
  // any stray render call benign.
  function DCArtboard() { return null; }
  function DCPostIt()    { return null; }

  // ─── PrintPage ───
  // One A4 page per artboard. The artboard's natural pixel size is honored;
  // if it doesn't fit the available print area at 1:1, we apply a CSS
  // transform:scale to fit. The label and section name run as a header
  // on every page so the printed deck is self-orienting.
  // A4 portrait at 96dpi = 794×1123 px. Page padding = 16mm/14mm/18mm.
  // Header takes ~26px; body area roughly 740×940 px.
  const PRINT_AREA_W = 740;
  const PRINT_AREA_H = 940;

  function PrintPage({ artboard, section }) {
    const { width = 376, height = 812, children, label } = artboard.props;
    const fit = Math.min(1, PRINT_AREA_W / width, PRINT_AREA_H / height);
    const scaledW = width * fit;
    const scaledH = height * fit;
    return (
      <div className="page">
        <div className="page-head">
          <span className="page-eyebrow">{section}</span>
          <span className="page-label">{label}</span>
        </div>
        <div className="page-body">
          <div
            className="artboard-scaler"
            style={{ width: scaledW, height: scaledH, position: 'relative' }}
          >
            <div
              style={{
                width: width,
                height: height,
                transform: `scale(${fit})`,
                transformOrigin: 'top left',
                position: 'absolute',
                top: 0, left: 0,
              }}
            >
              {children}
            </div>
          </div>
        </div>
      </div>
    );
  }

  // Override the canvas-mode globals BEFORE tf-app.jsx is evaluated.
  Object.assign(window, { DesignCanvas, DCSection, DCArtboard, DCPostIt });
</script>

<!-- Shared TF + section modules (unchanged from the source HTML). -->
<script type="text/babel" src="tf-shared.jsx"></script>
<script type="text/babel" src="tf-onboarding.jsx"></script>
<script type="text/babel" src="tf-notifications.jsx"></script>
<script type="text/babel" src="tf-dash-shared.jsx"></script>
<script type="text/babel" src="tf-dash-t1.jsx"></script>
<script type="text/babel" src="tf-dash-t2.jsx"></script>
<script type="text/babel" src="tf-dash-t3.jsx"></script>
<script type="text/babel" src="tf-dash-t4.jsx"></script>

<script type="text/babel" src="tf-dash-review-shared.jsx"></script>
<script type="text/babel" src="tf-dash-rev-std.jsx"></script>
<script type="text/babel" src="tf-dash-rev-adv.jsx"></script>
<script type="text/babel" src="tf-dash-rev-ent.jsx"></script>
<script type="text/babel" src="tf-inventory.jsx"></script>
<script type="text/babel" src="tf-inv-1-home.jsx"></script>
<script type="text/babel" src="tf-inv-2-detail.jsx"></script>
<script type="text/babel" src="tf-inv-3-add.jsx"></script>
<script type="text/babel" src="tf-inv-4-count.jsx"></script>
<script type="text/babel" src="tf-inv-5-report.jsx"></script>
<script type="text/babel" src="tf-inv-tiers.jsx"></script>
<script type="text/babel" src="tf-foh-tiers.jsx"></script>
<script type="text/babel" src="tf-orders-shim.jsx"></script>

<!-- Stub the tweaks panel so tf-app.jsx's <TweaksPanel> renders nothing. -->
<script type="text/babel">
  function TweaksPanel()  { return null; }
  function TweakSection() { return null; }
  function TweakRadio()   { return null; }
  function TweakColor()   { return null; }
  function TweakSelect()  { return null; }
  function TweakSlider()  { return null; }
  function TweakToggle()  { return null; }
  function TweakText()    { return null; }
  function TweakNumber()  { return null; }
  function TweakButton()  { return null; }
  function useTweaks(defaults) {
    const [t] = React.useState(defaults || {});
    return [t, () => {}];
  }
  Object.assign(window, {
    TweaksPanel, TweakSection, TweakRadio, TweakColor, TweakSelect,
    TweakSlider, TweakToggle, TweakText, TweakNumber, TweakButton, useTweaks,
  });
</script>

<script type="text/babel" src="tf-app.jsx"></script>

<!-- Auto-print: wait for fonts + Babel transforms + a settle delay. -->
<script type="text/babel">
  (async () => {
    try { await document.fonts.ready; } catch (e) {}
    // give React a chance to mount the world
    await new Promise((r) => requestAnimationFrame(() => r()));
    await new Promise((r) => requestAnimationFrame(() => r()));
    await new Promise((r) => setTimeout(r, 700));
    window.print();
  })();
</script>
</body>
</html>

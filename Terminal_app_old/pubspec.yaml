name: terminal_pos
description: "QuickBites — lightweight Android terminal POS app."
publish_to: 'none'

version: 1.3.5+6

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  http_parser: ^4.1.2
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.3
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.1.1
  image_picker: ^1.2.2
  web_socket_channel: ^3.0.2
  qr_flutter: ^4.1.0
  qr: ^3.0.2
  esc_pos_utils_plus: ^2.0.4
  permission_handler: ^12.0.1
  cached_network_image: ^3.4.1
  image: ^4.5.0
  google_sign_in: ^6.3.0
  sms_autofill: ^2.4.0
  audioplayers: ^6.1.0
  flutter_local_notifications: ^19.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Only splash.jpeg from brand/ is used by the terminal; Admin_res.png and
    # the other brand images (bkash/terabyte_ai) are unused here and were
    # bloating the bundle.
    - assets/brand/splash.jpeg
    - assets/sounds/
    - assets/menu_placeholders/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
    - family: Hind Siliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
    - family: Noto Sans Bengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono.ttf
          weight: 500

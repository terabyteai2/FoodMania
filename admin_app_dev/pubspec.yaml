name: local_pos
description: "QuickBites — Restaurant POS Admin app."
publish_to: 'none'

version: 1.5.1+10

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  http: ^1.6.0
  http_parser: ^4.1.2
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.3
  url_launcher: ^6.3.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.1.1
  image_picker: ^1.2.2
  camera: ^0.11.1
  web_socket_channel: ^3.0.2
  pdf: ^3.12.0
  printing: ^5.14.3
  qr_flutter: ^4.1.0
  qr: ^3.0.2
  webview_flutter: 4.9.0
  print_bluetooth_thermal: ^1.1.9
  esc_pos_utils_plus: ^2.0.4
  permission_handler: ^12.0.1
  cached_network_image: ^3.4.1
  image: ^4.5.0
  sms_autofill: ^2.4.0
  audioplayers: ^6.1.0
  flutter_local_notifications: ^19.4.0
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.0
  flutter_bluetooth_serial: ^0.4.0
  flutter_background_service: ^5.1.0
  lucide_flutter: ^1.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/sounds/
    - assets/menu_placeholders/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
    - family: Noto Sans Bengali
      fonts:
        - asset: assets/fonts/NotoSansBengali[wdth,wght].ttf
